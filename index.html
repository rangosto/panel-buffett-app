<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Solo puede hablar con la API de GitHub; no carga nada de otras webs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Tu panel de bolsa al estilo Buffett: cartera, termómetro del mercado, oportunidades y superinversores.">
  <title>Panel Buffett</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="stylesheet" href="vars.css">
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="app.css">
  <script src="plotly.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header id="cabecera">
    <button id="volver" class="icono" aria-label="Volver" hidden>←</button>
    <div class="titulo">
      <h1 id="titulo">Panel Buffett</h1>
      <div id="frescura" class="frescura"></div>
    </div>
    <button id="buscar" class="icono" aria-label="Buscar una empresa">🔍</button>
    <button id="actualizar" class="icono" aria-label="Actualizar los datos">🔄</button>
  </header>

  <div id="progreso" class="progreso" hidden role="status" aria-live="polite"></div>
  <main id="pantalla" tabindex="-1"></main>

  <nav id="menu" aria-label="Secciones">
    <a href="#/mercado" data-sec="mercado"><span>🌡️</span>Mercado</a>
    <a href="#/cartera" data-sec="cartera"><span>💼</span>Cartera</a>
    <a href="#/oportunidades" data-sec="oportunidades"><span>💎</span>Ideas</a>
    <a href="#/superinversores" data-sec="superinversores"><span>🐳</span>Gurús</a>
    <a href="#/aprende" data-sec="aprende"><span>📚</span>Aprende</a>
  </nav>

  <!-- Hoja inferior: explicación de cada ⓘ y menús de acciones -->
  <div id="velo" class="velo" hidden></div>
  <section id="hoja" class="hoja" hidden role="dialog" aria-modal="true" aria-labelledby="hoja-titulo">
    <div class="asa" aria-hidden="true"></div>
    <div id="hoja-contenido"></div>
    <button id="hoja-cerrar" class="boton secundario ancho">Cerrar</button>
  </section>

  <div id="avisos" class="avisos" aria-live="polite"></div>
  <noscript><p style="padding:24px">Esta app necesita JavaScript.</p></noscript>
</body>
</html>
